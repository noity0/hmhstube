<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>hmhstube - Not Found</title>
  <style>
    :root{--bg:#0f0f0f;--elev:#1c1c1c;--hover:#2a2a2a;--line:#2f2f2f;--txt:#f1f1f1;--dim:#aaaaaa;--mute:#717171;--red:#ff0033}
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .container{max-width:800px;text-align:center;padding:40px 20px}
    h1{font-size:48px;margin-bottom:20px;color:var(--red)}
    h2{font-size:24px;margin-bottom:30px;color:var(--dim)}
    p{font-size:18px;line-height:1.6;margin-bottom:30px}
    .btn{display:inline-block;background:var(--red);color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;transition:transform 0.2s}
    .btn:hover{transform:scale(1.05)}
    .logo{font-size:32px;font-weight:800;margin-bottom:20px}
    .logo b{color:var(--red)}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><b>hmhstube</b></div>
    <h1>404 - Page Not Found</h1>
    <h2>Oops! The page you're looking for doesn't exist.</h2>
    <p>This might be because:</p>
    <ul style="text-align:left;display:inline-block;margin-bottom:30px">
      <li>The page has been moved or deleted</li>
      <li>You've mistyped the URL</li>
      <li>The page never existed</li>
    </ul>
    <p>Don't worry! You can get back to browsing YouTube by visiting our <a href="/" class="btn">Home Page</a>.</p>
  </div>
</body>
</html>
